<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLAP_DEGI_LAPTIMER - V12.6</title>
    <style>
        :root { --hrc-red: #E4002B; --hrc-white: #ffffff; --bg-dark: #000000; --hrc-orange: #FFA500; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-dark); color: var(--hrc-white); font-family: 'Arial Black', sans-serif; overflow: hidden; }
        #dashboard { position: relative; width: 100vw; height: 100dvh; }
        
        /* メインUI */
        .main-ui-container { position: absolute; left: 32%; top: 42%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 5; width: 60%; }
        #display1 { font-size: 19vh; font-weight: 900; line-height: 0.8; white-space: nowrap; }

        /* セクター表示：サイズアップ */
        #sector-container { display: flex; justify-content: center; gap: 25px; font-size: 6vh; font-weight: 900; margin-top: 2vh; }
        .sec-name { color: var(--hrc-red); margin-right: 6px; font-size: 2.8vh; }

        /* 下段情報 */
        .sub-times { display: flex; flex-direction: column; align-items: center; margin-top: 4vh; gap: 2.5vh; }
        #display { font-size: 3.5vh; color: #fff; font-weight: 900; opacity: 0.8; }
        #best-display { font-size: 9.5vh; color: #fff; font-weight: 900; line-height: 0.9; }
        .best-label { font-size: 2.2vh; color: var(--hrc-red); margin-right: 15px; vertical-align: middle; }

        /* 右側パネル */
        .right-section-wrapper { position: absolute; right: 10px; top: 15px; bottom: 75px; display: flex; gap: 15px; align-items: flex-start; }
        #lap-panel { width: 150px; height: 100%; display: flex; flex-direction: column; }
        #lap { flex: 1; overflow-y: auto; scrollbar-width: none; text-align: right; }
        /* 右側パネルのラップ行：右寄せに配置を変更 */
.lap-row { 
    display: flex; 
    justify-content: flex-end; /* 右側に寄せる */
    align-items: baseline;     /* 文字の下端を揃える */
    gap: 15px;                 /* L番号とタイムの間隔（ここでお好みの距離に調整） */
    padding: 6px 0; 
    border-bottom: 1px solid #222; 
    font-size: 22px;           /* 少し大きめに設定 */
}

/* L1, L2などの番号部分 */
.lap-row span:first-child {
    color: #888;
    font-size: 22px;           /* 番号は小さくしてタイムを引き立てる */
    font-weight: normal;
}

/* タイム部分 */
.lap-row span:last-child {
    font-family: 'Arial Black', sans-serif;
    min-width: 110px;          /* タイムの桁数が変わってもガタつかないように固定幅を確保 */
    text-align: right;
}
        .best-lap { color: var(--hrc-red); font-weight: bold; }
        .data-column { display: flex; flex-direction: column; gap: 15px; min-width: 90px; }
        .data-box { text-align: right; }
        .label { font-size: 11px; color: var(--hrc-red); font-weight: bold; }
        .val { font-size: 42px; font-weight: 900; line-height: 0.85; }

        footer { height: 60px; display: flex; gap: 2px; padding: 4px; background: #000; border-top: 1px solid #333; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
        button { flex: 1; background: #111; color: #fff; border: 1px solid #333; border-radius: 4px; font-size: 10px; font-weight: bold; }
        button.active { background: var(--hrc-red) !important; }

        /* HISTORY ページ */
        #history-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; padding: 20px; box-sizing: border-box; }
        .close-btn { background: var(--hrc-red); padding: 15px; text-align: center; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        #history-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        #history-table th { color: var(--hrc-red); border-bottom: 2px solid var(--hrc-red); padding: 8px; }
        #history-table td { padding: 8px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>
<div id="dashboard">
    <div class="main-ui-container">
        <div id="display1">00:00.000</div>
        <div id="sector-container">
            <span class="sec-item"><span class="sec-name">S1:</span><span id="s1_val">--.---</span></span>
            <span class="sec-item"><span class="sec-name">S2:</span><span id="s2_val">--.---</span></span>
            <span class="sec-item"><span class="sec-name">S3:</span><span id="s3_val">--.---</span></span>
        </div>
        <div class="sub-times">
            <div id="display">TOTAL 00:00.000</div>
            <div id="best-display"><span class="best-label">BEST LAP</span>00:00.000</div>
        </div>
    </div>

    <div class="right-section-wrapper">
        <div id="lap-panel">
            <div class="label" style="text-align:right; margin-bottom:5px;">HISTORY</div>
            <div id="lap"></div>
        </div>
        <div class="data-column">
            <div class="data-box"><div class="label">SPD</div><div class="val" id="speed_val">0</div></div>
            <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color: var(--hrc-orange);">0</div></div>
        </div>
    </div>

    <footer>
        <button id="usbGpsBtn">USB GPS</button>
        <button id="startBtn">START</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="historyBtn">HISTORY</button>
        <button id="gpxBtn" style="display:none; background:var(--hrc-orange); color:#000;">GPX SAVE</button>
        <button onclick="if(confirm('RESET ALL?')) location.reload()">RELOAD</button>
    </footer>
</div>

<div id="history-page">
    <div class="close-btn" onclick="document.getElementById('history-page').style.display='none'">CLOSE</div>
    <div style="overflow-y: auto; height: calc(100% - 80px);">
       <table id="history-table">
    <thead>
        <tr>
            <th>LAP</th>
            <th>S1</th>
            <th>S2</th>
            <th>S3</th>
            <th>S4</th> <th>TIME</th>
            <th style="color:var(--hrc-orange);">MAX</th>
        </tr>
    </thead>
    <tbody id="history-body"></tbody>
</table>
    </div>
</div>

<script>
'use strict';
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [], gpsPoints = [];
let device = null, nmeaBuffer = '', lastPos = null;
let lines = { startLine: null, s1Line: null, s2Line: null, s3Line: null };
let currentSpeedKmh = 0, maxSpeedInLap = 0;
let isFrozen = false, freezeDisplayTime = "00:00.000", freezeUntil = 0;

let currentLapPoints = [];   
let validDirection = null; 
let sectorDirections = { s1: null, s2: null, s3: null };
let cooldownMs = 15000; // 15秒（ピットアウト直後の誤作動防止）  
let lapCount = 1;
let s1_abs = 0, s2_abs = 0, s3_abs = 0, s4_abs = 0; // s4_absを追加
    
function processLap(hitTime, isManual = false) {
    const baseTime = lapStartTime > 0 ? lapStartTime : startTime;
    
    if (baseTime > 0) {
        const lapTimeMs = hitTime - baseTime;
        const lapTimeSec = lapTimeMs / 1000;

        if (!isManual) {
            isFrozen = true;
            freezeUntil = Date.now() + 15000;
            freezeDisplayTime = timeFormat(lapTimeMs);
        }

        // --- セクター計算 ---
        const s1_text = s1_abs > 0 ? s1_abs.toFixed(3) : "--.---";
        const s2_text = (s2_abs > 0 && s1_abs > 0) ? (s2_abs - s1_abs).toFixed(3) : "--.---";
        const s3_text = (s3_abs > 0 && s2_abs > 0) ? (s3_abs - s2_abs).toFixed(3) : "--.---";
        
        // --- S4の計算ロジック（柔軟な判定） ---
        // S3があればS3から、なければS2から、それもなければS1から、最後はスタートからの時間をS4とする
       let s4_text = "--.---";
        if (s3_abs > 0) {
            // S3を通過している場合
            s4_text = (lapTimeSec - s3_abs).toFixed(3);
        } else if (s2_abs > 0) {
            // S2まで通過している場合
            s4_text = (lapTimeSec - s2_abs).toFixed(3);
        } else if (s1_abs > 0) {
            // S1まで通過している場合
            s4_text = (lapTimeSec - s1_abs).toFixed(3);
        } else {
            // セクターを一つも通らなかった場合（S1〜S3がすべて0）
            s4_text = "--.---"; 
        }

        const lapData = {
            no: lapRecords.length + 1,
            time: lapTimeMs, 
            s1: s1_text,
            s2: s2_text,
            s3: s3_text,
            s4: s4_text, 
            max: maxSpeedInLap,
            points: [...currentLapPoints]
        };

        lapRecords.unshift(lapData);
        updateLapList();
    }

    // --- 次のラップのためのリセット ---
    lapStartTime = hitTime;
    currentLapPoints = [];
    maxSpeedInLap = 0;
    s1_abs = 0; s2_abs = 0; s3_abs = 0;
    
    document.querySelectorAll('[id$="_val"]').forEach(el => {
        if(el.id.startsWith('s')) el.textContent = "--.---";
    });
}
function updateLapList() {
    if (lapRecords.length === 0) return;

    // ベストラップの算出（timeはミリ秒）
    const bestTime = Math.min(...lapRecords.map(r => r.time));

    // メイン画面のBEST表示を更新
    document.getElementById('best-display').innerHTML = 
        `<span class="best-label">BEST LAP</span>${timeFormat(bestTime)}`;

    // メイン画面右側のラップリスト（最新5〜10件程度が表示される）
    document.getElementById('lap').innerHTML = lapRecords.map(r => `
        <div class="lap-row ${r.time === bestTime ? 'best-lap' : ''}">
            <span>L${r.no}</span>
            <span>${timeFormat(r.time)}</span>
        </div>`).join('');
}

function updateLapList() {
    if (lapRecords.length === 0) return;
    const bestTime = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('best-display').innerHTML = `<span class="best-label">BEST LAP</span>${timeFormat(bestTime)}`;
    document.getElementById('lap').innerHTML = lapRecords.map(r => `<div class="lap-row ${r.time === bestTime ? 'best-lap' : ''}"><span>L${r.no}</span><span>${timeFormat(r.time)}</span></div>`).join('');
}

function mainLoop() {
    const now = Date.now();
    if (swState === 1) {
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        document.getElementById('display1').textContent = (isFrozen && now < freezeUntil) ? freezeDisplayTime : timeFormat(now - (lapStartTime || startTime));
    }
    document.getElementById('speed_val').textContent = Math.round(currentSpeedKmh);
    document.getElementById('max_speed_val').textContent = maxSpeedInLap;
    requestAnimationFrame(mainLoop);
}

// 2. 通過判定ロジック（各セクターの方向を個別に学習・記憶）
function parseNMEA(line) {
    if (!line.includes('RMC') && !line.includes('GGA')) return;
    const p = line.split(',');
    
    if (line.includes('RMC') && p[2] === 'A') {
        currentSpeedKmh = parseFloat(p[7]) * 1.852;
        if (currentSpeedKmh > maxSpeedInLap) maxSpeedInLap = Math.round(currentSpeedKmh);
    }
    
    if (line.includes('GGA') && (p[6] !== '0' && p[6] !== '')) {
        const cur = { lat: dmmToDec(p[2], p[3]), lon: dmmToDec(p[4], p[5]), time: Date.now() };
    
        if (swState === 1) {
            currentLapPoints.push({ lat: cur.lat, lon: cur.lon, time: new Date().toISOString(), speed: currentSpeedKmh });
            
            if (lastPos) {
                // --- 1. スタート/コントロールライン判定 ---
                const hitSL = getIntersection(lastPos, cur, lines.startLine);
                if (hitSL) {
                    // 初回通過時に方向を記憶
                    if (validDirection === null) validDirection = hitSL.dir;

                    // クールダウン（15秒）設定
                    const cooldownMs = 15000; 

                    // 記憶した方向と一致し、かつ15秒経過している場合のみラップ開始
                    if (hitSL.dir === validDirection && (hitSL.time - (lapStartTime || startTime) > cooldownMs)) {
                        processLap(hitSL.time, false);
                    }
                }

                // --- 2. セクターライン判定（V2.1 厳格仕様） ---
                // スタートラインを通過（lapStartTime > 0）するまで、セクター判定は一切行わない
                if (lapStartTime > 0) {
                    ['s1', 's2', 's3'].forEach((s) => {
                        const hit = getIntersection(lastPos, cur, lines[s + 'Line']);
                        if (hit) {
                            // 各セクターラインの通過方向を個別に記憶
                            if (sectorDirections[s] === null) sectorDirections[s] = hit.dir;

                            // 記憶した方向と一致する場合のみ記録
                            if (hit.dir === sectorDirections[s]) {
                                const absTime = (hit.time - lapStartTime) / 1000;
                                
                                if (s === 's1' && s1_abs === 0) {
                                    s1_abs = absTime;
                                    document.getElementById('s1_val').textContent = s1_abs.toFixed(3);
                                } else if (s === 's2' && s2_abs === 0 && s1_abs > 0) {
                                    s2_abs = absTime;
                                    document.getElementById('s2_val').textContent = (s2_abs - s1_abs).toFixed(3);
                                } else if (s === 's3' && s3_abs === 0 && s2_abs > 0) {
                                    s3_abs = absTime;
                                    document.getElementById('s3_val').textContent = (s3_abs - s2_abs).toFixed(3);
                                }
                            }
                        }
                    });
                }
            }
        }
        lastPos = cur;
        document.getElementById('usbGpsBtn').style.background = "var(--hrc-red)";
    }
}

document.getElementById('gpxBtn').onclick = function() {
    if (lapRecords.length === 0) {
        alert("保存するラップデータがありません。");
        return;
    }

    // ライン情報を維持（独自形式としてdescに格納）
    let lineMeta = "";
    if (lines.startLine) {
        const l = lines;
        lineMeta = `[SL:${l.startLine.p1.lat},${l.startLine.p1.lon},${l.startLine.p2.lat},${l.startLine.p2.lon}]`;
        if (l.s1Line) lineMeta += `[S1:${l.s1Line.p1.lat},${l.s1Line.p1.lon},${l.s1Line.p2.lat},${l.s1Line.p2.lon}]`;
        if (l.s2Line) lineMeta += `[S2:${l.s2Line.p1.lat},${l.s2Line.p1.lon},${l.s2Line.p2.lat},${l.s2Line.p2.lon}]`;
        if (l.s3Line) lineMeta += `[S3:${l.s3Line.p1.lat},${l.s3Line.p1.lon},${l.s3Line.p2.lat},${l.s3Line.p2.lon}]`;
    }

    let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="KLAP_DEGI_V12" xmlns="http://www.topografix.com/GPX/1/1">
<metadata>
    <name>KLAP Session ${new Date().toLocaleString()}</name>
    <desc>LINE_DATA:${lineMeta}</desc>
</metadata>
<trk>
<name>Track_Log</name>
<trkseg>`; // 全ラップを一つのtrksegにまとめる

    // ラップを時系列順（L1, L2, L3...）に並べ替え
    const sortedLaps = [...lapRecords].sort((a, b) => a.no - b.no);

    sortedLaps.forEach((lap) => {
        if (lap.points.length < 2) return;

        lap.points.forEach(p => {
            const speedMS = (p.speed / 3.6).toFixed(2);
            // ISO 8601形式の時刻を確保
            gpx += `\n<trkpt lat="${p.lat}" lon="${p.lon}"><time>${p.time}</time><extensions><speed>${speedMS}</speed></extensions></trkpt>`;
        });
    });

    gpx += `\n</trkseg>\n</trk>\n</gpx>`;

    // ダウンロード
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `KLAP_${new Date().getTime()}.gpx`;
    a.click();
    URL.revokeObjectURL(url);
};

// 1. 交点計算と方向判定（外積）を行う関数
function getIntersection(p1, p2, line) {
    if (!line) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = line.p1.lon, y3 = line.p1.lat, x4 = line.p2.lon, y4 = line.p2.lat;
    
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    
    // ラインを跨いだ場合（予測時刻を計算）
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
        // 方向判定（外積を用いて左右どちらから進入したかを算出）
        const Lx = x4 - x3;
        const Ly = y4 - y3;
        const Vx = x2 - x1;
        const Vy = y2 - y1;
        const dir = (Lx * Vy - Ly * Vx) > 0 ? 1 : -1;
        
        return { 
            time: p1.time + (p2.time - p1.time) * t,
            dir: dir 
        };
    }
    return null;
}


function dmmToDec(d, dir){ if(!d) return 0; const dot=d.indexOf('.'); const deg=parseInt(d.substring(0,dot-2)), min=parseFloat(d.substring(dot-2)); return (dir==='S'||dir==='W')?-(deg+min/60):(deg+min/60); }
function timeFormat(ms){ const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), ms2=Math.floor(ms%1000); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms2.toString().padStart(3,'0')}`; }

// 3. STARTボタン（走行開始時に記憶をリセット）
document.getElementById('startBtn').onclick = function() {
    if (swState !== 1) { 
        swState = 1; startTime = Date.now(); lapStartTime = 0; lapRecords = []; gpsPoints = [];
        // 方向記憶を初期化（新しい走行セッションの最初に学習し直す）
        validDirection = null;
        sectorDirections = { s1: null, s2: null, s3: null };
        this.classList.add('active'); document.getElementById('gpxBtn').style.display = 'none';
    } else { 
        swState = 2; this.classList.remove('active'); document.getElementById('gpxBtn').style.display = 'block'; 
    }
};
document.getElementById('lapBtn').onclick = function() {
    if (swState === 1) processLap(Date.now(), true);
    else if (confirm("RESET ALL?")) location.reload();
};
document.getElementById('usbGpsBtn').onclick = async function() {
    try {
        device = await navigator.usb.requestDevice({ filters: [] });
        await device.open(); await device.selectConfiguration(1); await device.claimInterface(1);
        while (device) {
            const res = await device.transferIn(2, 512);
            const linesN = (nmeaBuffer + new TextDecoder().decode(res.data)).split(/\r?\n/);
            nmeaBuffer = linesN.pop(); linesN.forEach(parseNMEA);
        }
    } catch (e) {}
};
document.getElementById('historyBtn').onclick = function() {
    if (lapRecords.length === 0) return;
    const bT = Math.min(...lapRecords.map(r => r.time));
    
    document.getElementById('history-body').innerHTML = lapRecords.map(r => `
        <tr>
            <td>${r.no}</td>
            <td>${r.s1}</td>
            <td>${r.s2}</td>
            <td>${r.s3}</td>
            <td>${r.s4}</td> <td style="${r.time === bT ? 'color:var(--hrc-red);font-weight:bold;' : ''}">
                ${timeFormat(r.time)}
            </td>
            <td style="color:var(--hrc-orange);">${r.max}</td>
        </tr>`).join('');
    document.getElementById('history-page').style.display = 'block';
};

window.onload = () => {
    ['startLine', 's1Line', 's2Line', 's3Line'].forEach(key => {
        if (localStorage.getItem(key + 'P1Lat')) {
            lines[key] = {
                p1: { lat: parseFloat(localStorage.getItem(key + 'P1Lat')), lon: parseFloat(localStorage.getItem(key + 'P1Lon')) },
                p2: { lat: parseFloat(localStorage.getItem(key + 'P2Lat')), lon: parseFloat(localStorage.getItem(key + 'P2Lon')) }
            };
        }
    });
    mainLoop();
};
</script>
</body>
</html>
